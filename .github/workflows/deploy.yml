name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Pages project (if not exists)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@3 pages project create pulsify-dashboard \
            --production-branch main 2>&1 || echo "Project may already exist, continuing..."

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@3 pages deploy . \
            --project-name pulsify-dashboard \
            --branch main \
            --commit-dirty=true 2>&1

      - name: Enable Cloudflare Access
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          EXISTING=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/access/apps" \
            -H "Authorization: Bearer $CF_TOKEN" | \
            python3 -c "import sys,json; apps=json.load(sys.stdin).get('result') or []; print(next((a['id'] for a in apps if 'pulsify' in a.get('name','').lower()), ''))")

          if [ -z "$EXISTING" ]; then
            echo "Creating Cloudflare Access application..."
            curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/access/apps" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "name": "Pulsify Dashboard",
                "domain": "pulsify-dashboard.pages.dev",
                "type": "self_hosted",
                "session_duration": "24h",
                "auto_redirect_to_identity": true
              }' | python3 -c "import sys,json; r=json.load(sys.stdin); print('Access:', 'created' if r.get('success') else r.get('errors'))"
          else
            echo "Access app already exists: $EXISTING"
          fi

      - name: Done
        run: echo "Live at https://pulsify-dashboard.pages.dev"
