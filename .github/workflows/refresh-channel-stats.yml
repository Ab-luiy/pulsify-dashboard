name: Refresh Own YouTube Stats

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull public channel and latest-video stats
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python tools/refresh_channel_stats.py
      - name: Commit changed stats
        run: |
          git config user.name "pulsify-bot"
          git config user.email "bot@pulsify.local"
          if git diff --quiet -- dashboard-data-v2.json; then exit 0; fi
          git add dashboard-data-v2.json
          git commit -m "Refresh own YouTube stats ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
