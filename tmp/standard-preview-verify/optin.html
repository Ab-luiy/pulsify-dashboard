<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Frank Wieler — Private training</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#131720;--muted:#626a78;--blue:#6871f4;--line:#e9e8ef}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 20%,#e9e7ff 0,transparent 38%),#fff;color:var(--ink);font-family:Inter,system-ui,sans-serif}
    main{width:min(620px,100%);text-align:center}.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border:1px solid rgba(104,113,244,.2);border-radius:999px;background:rgba(255,255,255,.72);font-size:11px;font-weight:700;color:#5058ca}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 5px rgba(104,113,244,.1)}h1{font-size:clamp(38px,7vw,66px);line-height:.98;letter-spacing:-.06em;margin:26px 0 18px}h1 em{display:block;color:var(--blue);font-style:normal}p{max-width:540px;margin:0 auto;color:var(--muted);line-height:1.65;font-size:15px}
    form{display:grid;grid-template-columns:1fr auto;gap:9px;max-width:520px;margin:30px auto 12px;padding:9px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 18px 60px rgba(70,58,150,.09)}
    input{min-width:0;border:0;outline:0;padding:11px;font:inherit;font-size:14px}button{border:0;border-radius:9px;background:var(--blue);color:#fff;padding:0 20px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}button:disabled{opacity:.6}
    .note{font-size:11px;color:#8a8f9a}[data-submitted=true]::after{content:"Check your inbox. Loading the training…";grid-column:1/-1;color:#14805e;font-size:12px;padding:7px}
    @media(max-width:520px){form{grid-template-columns:1fr}button{padding:13px}}
  </style>
</head>
<body data-client="frank" data-page-id="optin">
  <main>
    <div class="pill"><span class="dot"></span>Free private training</div>
    <h1>Build a subscription brand <em>that pays every month</em></h1>
    <p>Enter your email to watch Frank's subscription-first brand breakdown. Your email is sent to Kit and the training opens immediately.</p>
    <form data-pulsify-optin data-success="/">
      <input type="email" name="email" required autocomplete="email" placeholder="Your best email">
      <button type="submit">WATCH THE TRAINING</button>
    </form>
    <div class="note">No spam. Unsubscribe any time.</div>
  </main>
  <script src="js/funnel-integrations.js"></script>
</body>
</html>
