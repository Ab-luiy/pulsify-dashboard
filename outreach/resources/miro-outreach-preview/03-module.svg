<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050"><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e3e0d8" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#171717"/></marker></defs><rect width="100%" height="100%" fill="#f5f3ee"/><rect width="100%" height="100%" fill="url(#grid)"/><g font-family="Arial, sans-serif"><text x="48" y="61" font-size="26" fill="#355ed4" font-weight="800">03</text><text x="108" y="63" font-size="34" fill="#171717" font-weight="800">Video structure</text><text x="48" y="113" font-size="25" fill="#355ed4" font-weight="700">Talking points you can record from.</text><rect x="53" y="213" width="200" height="202" rx="12" fill="#171717"/><rect x="48" y="207" width="200" height="202" rx="12" fill="#fff" stroke="#171717" stroke-width="2.3"/><text x="63" y="246" font-size="21" fill="#355ed4" font-weight="800">01</text><text x="63" y="285" font-size="25" fill="#171717" font-weight="800">Intro</text><text x="63" y="334" font-size="16" fill="#171717" font-weight="500">Show real proof.</text><text x="63" y="359" font-size="16" fill="#171717" font-weight="500">Confirm the title.</text><path d="M252,305 L269,305" stroke="#171717" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="279" y="213" width="200" height="202" rx="12" fill="#171717"/><rect x="274" y="207" width="200" height="202" rx="12" fill="#fff" stroke="#171717" stroke-width="2.3"/><text x="289" y="246" font-size="21" fill="#355ed4" font-weight="800">02</text><text x="289" y="285" font-size="25" fill="#171717" font-weight="800">Body</text><text x="289" y="334" font-size="16" fill="#171717" font-weight="500">What changed?</text><text x="289" y="359" font-size="16" fill="#171717" font-weight="500">Show what you did.</text><path d="M478,305 L495,305" stroke="#171717" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="505" y="213" width="200" height="202" rx="12" fill="#171717"/><rect x="500" y="207" width="200" height="202" rx="12" fill="#e2e9ff" stroke="#171717" stroke-width="2.3"/><text x="515" y="246" font-size="21" fill="#355ed4" font-weight="800">03</text><text x="515" y="285" font-size="21" fill="#171717" font-weight="800">Mid-video CTA</text><text x="515" y="334" font-size="16" fill="#171717" font-weight="500">Offer help applying it.</text><text x="515" y="359" font-size="16" fill="#171717" font-weight="500">Then keep teaching.</text><path d="M704,305 L721,305" stroke="#171717" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="731" y="213" width="200" height="202" rx="12" fill="#171717"/><rect x="726" y="207" width="200" height="202" rx="12" fill="#fff" stroke="#171717" stroke-width="2.3"/><text x="741" y="246" font-size="21" fill="#355ed4" font-weight="800">04</text><text x="741" y="285" font-size="25" fill="#171717" font-weight="800">Body</text><text x="741" y="334" font-size="16" fill="#171717" font-weight="500">Show another example.</text><text x="741" y="359" font-size="16" fill="#171717" font-weight="500">Explain the decisions.</text><path d="M930,305 L947,305" stroke="#171717" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="957" y="213" width="200" height="202" rx="12" fill="#171717"/><rect x="952" y="207" width="200" height="202" rx="12" fill="#fff" stroke="#171717" stroke-width="2.3"/><text x="967" y="246" font-size="21" fill="#355ed4" font-weight="800">05</text><text x="967" y="285" font-size="25" fill="#171717" font-weight="800">Final CTA</text><text x="967" y="334" font-size="16" fill="#171717" font-weight="500">Recap the result.</text><text x="967" y="359" font-size="16" fill="#171717" font-weight="500">Give one next step.</text><text x="48" y="161" font-size="23" fill="#171717" font-weight="700">Intro → body → mid-video CTA → body → final CTA</text><text x="48" y="494" font-size="29" fill="#171717" font-weight="800">One experience. Three different ways to explain it.</text><rect x="53" y="544" width="337" height="188" rx="12" fill="#171717"/><rect x="48" y="538" width="337" height="188" rx="12" fill="#fff" stroke="#171717" stroke-width="2.3"/><rect x="436" y="544" width="337" height="188" rx="12" fill="#171717"/><rect x="431" y="538" width="337" height="188" rx="12" fill="#fff" stroke="#171717" stroke-width="2.3"/><rect x="820" y="544" width="337" height="188" rx="12" fill="#171717"/><rect x="815" y="538" width="337" height="188" rx="12" fill="#fff" stroke="#171717" stroke-width="2.3"/><text x="70" y="584" font-size="25" fill="#171717" font-weight="800">Break down a win</text><text x="70" y="627" font-size="21" fill="#171717" font-weight="500">Show the result.</text><text x="70" y="661" font-size="21" fill="#171717" font-weight="500">Walk through the decisions.</text><text x="453" y="584" font-size="25" fill="#171717" font-weight="800">Explain a mistake</text><text x="453" y="627" font-size="21" fill="#171717" font-weight="500">Show what went wrong.</text><text x="453" y="661" font-size="21" fill="#171717" font-weight="500">Explain what you changed.</text><text x="837" y="584" font-size="25" fill="#171717" font-weight="800">Compare examples</text><text x="837" y="627" font-size="21" fill="#171717" font-weight="500">Put them side by side.</text><text x="837" y="661" font-size="21" fill="#171717" font-weight="500">Explain the difference.</text><rect x="53" y="783" width="1104" height="165" rx="12" fill="#171717"/><rect x="48" y="777" width="1104" height="165" rx="12" fill="#e2e9ff" stroke="#355ed4" stroke-width="2.3"/><text x="72" y="820" font-size="24" fill="#355ed4" font-weight="800">After a useful lesson:</text><text x="72" y="861" font-size="23" fill="#171717" font-weight="500">that's one of the things we work through in the program. if you want help</text><text x="72" y="895" font-size="23" fill="#171717" font-weight="500">applying it, the first link below explains more. if not, no worries, keep watching.</text><text x="48" y="999" font-size="24" fill="#171717" font-weight="700">Build from what you actually do. Give them the useful detail.</text></g></svg>