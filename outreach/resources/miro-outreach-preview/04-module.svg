<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050"><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e7e7e7" stroke-width="1"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#171717"/></marker></defs><rect width="100%" height="100%" fill="#f2f2f2"/><rect width="100%" height="100%" fill="url(#grid)"/><g font-family="Arial, sans-serif"><text x="48" y="61" font-size="26" fill="#171717" font-weight="800">04</text><text x="108" y="63" font-size="34" fill="#171717" font-weight="800">From viewer to client</text><text x="48" y="113" font-size="25" fill="#171717" font-weight="500">Give interested people a clear next step.</text><path d="M108,78 Q247.64999999999998,75 507,77" stroke="#e31b23" stroke-width="8" stroke-linecap="round" fill="none"/><rect x="225" y="163" width="750" height="121" rx="2" fill="#ffffff" stroke="#171717" stroke-width="2.3"/><text x="260" y="208" font-size="29" fill="#171717" font-weight="800">YouTube video</text><text x="260" y="248" font-size="24" fill="#171717" font-weight="500">They understand your approach.</text><path d="M600,292 Q596.76,309.28 600,328" stroke="#171717" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M596.76,323.68 Q600,326.92 600,328 L603.24,323.68" stroke="#171717" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="225" y="337" width="750" height="121" rx="2" fill="#fff" stroke="#171717" stroke-width="2.3"/><text x="260" y="382" font-size="29" fill="#171717" font-weight="800">DM or free training</text><text x="260" y="422" font-size="24" fill="#171717" font-weight="500">They explore getting your help.</text><path d="M600,466 Q596.76,483.28 600,502" stroke="#171717" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M596.76,497.68 Q600,500.92 600,502 L603.24,497.68" stroke="#171717" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="225" y="511" width="750" height="121" rx="2" fill="#fff" stroke="#171717" stroke-width="2.3"/><text x="260" y="556" font-size="29" fill="#171717" font-weight="800">Application</text><text x="260" y="596" font-size="24" fill="#171717" font-weight="500">You check whether it fits.</text><path d="M600,640 Q596.76,657.28 600,676" stroke="#171717" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M596.76,671.68 Q600,674.92 600,676 L603.24,671.68" stroke="#171717" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="225" y="685" width="750" height="121" rx="2" fill="#fff" stroke="#171717" stroke-width="2.3"/><text x="260" y="730" font-size="29" fill="#171717" font-weight="800">Sales conversation</text><text x="260" y="770" font-size="24" fill="#171717" font-weight="500">You discuss working together.</text><rect x="48" y="875" width="1104" height="121" rx="2" fill="#ffffff" stroke="#171717" stroke-width="2.3"/><text x="72" y="916" font-size="25" fill="#171717" font-weight="800">The overview is reusable. The roadmap is built around your business.</text><text x="72" y="960" font-size="24" fill="#171717" font-weight="700">Reply here and we can go through what this would look like for yours.</text></g></svg>