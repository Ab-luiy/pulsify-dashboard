font-size="29" fill="#171717" font-weight="800">Application</text><text x="260" y="596" font-size="24" fill="#171717" font-weight="500">You check whether it fits.</text><path d="M600,640 L600,676" stroke="#171717" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="230" y="691" width="750" height="121" rx="12" fill="#171717"/><rect x="225" y="685" width="750" height="121" rx="12" fill="#fff" stroke="#171717" stroke-width="2.3"/><text x="260" y="730" font-size="29" fill="#171717" font-weight="800">Sales conversation</text><text x="260" y="770" font-size="24" fill="#171717" font-weight="500">You discuss working together.</text><rect x="53" y="881" width="1104" height="121" rx="12" fill="#171717"/><rect x="48" y="875" width="1104" height="121" rx="12" fill="#e2e9ff" stroke="#355ed4" stroke-width="2.3"/><text x="72" y="916" font-size="25" fill="#355ed4" font-weight="800">The overview is reusable. The roadmap is built around your business.</text><text x="72" y="960" font-size="24" fill="#171717" font-weight="700">Reply here and we can go through what this would look like for yours.</text></g></svg>