<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulsify — Integration Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#131720; --muted:#626a78; --blue:#6871f4; --blue-soft:#eef0ff; --lavender:#f5f3ff;
    --line:#e9e8ef; --white:#fff; --green:#1f9d6b; --green-soft:#e6f7ef; --red:#c1422f; --red-soft:#fbeae7; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{ background:#f3f3f8; color:var(--ink); font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; padding:40px 16px; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:560px; margin:0 auto; }
  h1{ font-size:22px; font-weight:800; letter-spacing:-.02em; }
  .sub{ color:var(--muted); font-size:13.5px; margin:6px 0 26px; line-height:1.5; }
  .card{ background:var(--white); border:1px solid var(--line); border-radius:16px; box-shadow:0 18px 50px rgba(68,58,139,.06); padding:26px; }
  .gate{ text-align:center; }
  .gate p{ color:var(--muted); font-size:13.5px; margin-bottom:16px; }
  label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink); margin:16px 0 6px; }
  label:first-of-type{ margin-top:0; }
  label .hint{ font-weight:400; color:var(--muted); font-size:12px; display:block; margin-top:1px; }
  input{ width:100%; padding:12px 13px; border:1px solid var(--line); border-radius:9px; font-size:14px; font-family:inherit; color:var(--ink); background:#fafafd; }
  input:focus{ outline:2px solid var(--blue); outline-offset:1px; border-color:var(--blue); }
  .btn{ width:100%; margin-top:22px; background:var(--blue); color:#fff; border:0; cursor:pointer; font-family:inherit;
    font-weight:700; font-size:14px; padding:13px; border-radius:10px; }
  .btn:hover{ filter:brightness(1.05); }
  .btn:disabled{ opacity:.6; cursor:default; }
  .msg{ margin-top:14px; font-size:13px; padding:10px 13px; border-radius:9px; display:none; }
  .msg.ok{ display:block; background:var(--green-soft); color:var(--green); }
  .msg.err{ display:block; background:var(--red-soft); color:var(--red); }
  .status-row{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); margin-top:4px; }
  .dot{ width:6px; height:6px; border-radius:50%; background:var(--line); }
  .dot.set{ background:var(--green); }
  .foot{ text-align:center; margin-top:16px; font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Integration settings</h1>
  <p class="sub">Connect any client's landing page to Wistia, Typeform, Kit, and the portal. Secrets save straight to the backend and never need to pass through chat.</p>

  <div class="card" id="gateCard">
    <div class="gate">
      <p>Enter the admin key to unlock this page.</p>
      <input id="adminKey" type="password" placeholder="Admin key">
      <button class="btn" onclick="unlock()">Unlock</button>
      <div class="msg err" id="gateMsg"></div>
    </div>
  </div>

  <div class="card" id="formCard" style="display:none;">
    <label>Client ID<span class="hint">a short permanent id, e.g. "frank" &mdash; used by the page and portal</span></label>
    <input id="client" value="frank">

    <label>Client name<span class="hint">the display name used in the portal</span></label>
    <input id="client_name" placeholder="Frank Wieler">

    <label>Wistia media ID<span class="hint">from Wistia &rarr; Share &rarr; Embed (the code after wvideo=)</span></label>
    <input id="wistia_media_id" placeholder="e.g. ab12cd34ef">

    <label>Typeform link<span class="hint">the full share URL of the embedded application form</span></label>
    <input id="typeform_url" placeholder="https://form.typeform.com/to/XXXXXXXX">

    <label>Typeform webhook secret<span class="hint">set the same secret on the Typeform webhook so fake submissions are rejected</span></label>
    <input id="typeform_webhook_secret" type="password" placeholder="Leave blank to keep the saved secret">
    <div class="status-row"><span class="dot" id="typeformDot"></span><span id="typeformStatus">checking&hellip;</span></div>

    <label>Kit tag ID<span class="hint">Settings &rarr; Advanced &rarr; API in Kit</span></label>
    <input id="kit_tag_id" placeholder="e.g. 4915823">

    <label>Kit v4 API key<span class="hint" id="kitKeyHint">Kit &rarr; Settings &rarr; Developer &rarr; create a v4 API key</span></label>
    <input id="kit_api_key" type="password" placeholder="Leave blank to keep the saved key">
    <div class="status-row"><span class="dot" id="kitDot"></span><span id="kitStatus">checking&hellip;</span></div>

    <label>Landing-page origin<span class="hint">optional production domain, e.g. https://go.client.com</span></label>
    <input id="allowed_origin" placeholder="https://go.example.com">

    <button class="btn" id="saveBtn" onclick="save()">Save settings</button>
    <div class="msg" id="saveMsg"></div>
  </div>

  <p class="foot"><a href="/portal" style="color:inherit;">Open funnel portal</a> &middot; Pulsify integration pipe</p>
</div>

<script>
  let ADMIN_KEY = sessionStorage.getItem("pulsify_admin_key") || "";
  const requestedClient = new URLSearchParams(location.search).get("client");
  if (requestedClient) document.getElementById("client").value = requestedClient;

  async function unlock(){
    const key = document.getElementById("adminKey").value.trim();
    if (!key) return;
    ADMIN_KEY = key;
    const ok = await loadConfig();
    if (ok) {
      sessionStorage.setItem("pulsify_admin_key", key);
      document.getElementById("gateCard").style.display = "none";
      document.getElementById("formCard").style.display = "block";
    } else {
      document.getElementById("gateMsg").textContent = "Wrong key, or the pipe isn't deployed with ADMIN_KEY yet.";
      document.getElementById("gateMsg").className = "msg err";
    }
  }

  async function loadConfig(){
    const client = document.getElementById("client").value || "frank";
    try {
      const r = await fetch(`/api/settings?client=${encodeURIComponent(client)}`, { headers: { "x-admin-key": ADMIN_KEY } });
      if (!r.ok) return false;
      const data = await r.json();
      if (data.config) {
        document.getElementById("client_name").value = data.config.client_name || "";
        document.getElementById("wistia_media_id").value = data.config.wistia_media_id || "";
        document.getElementById("typeform_url").value = data.config.typeform_url || "";
        document.getElementById("kit_tag_id").value = data.config.kit_tag_id || "";
        document.getElementById("allowed_origin").value = data.config.allowed_origin || "";
        setKitStatus(!!data.config.kit_api_key_set);
        setTypeformStatus(!!data.config.typeform_webhook_secret_set);
      } else {
        setKitStatus(false);
        setTypeformStatus(false);
      }
      return true;
    } catch (e) { return false; }
  }

  function setKitStatus(isSet){
    document.getElementById("kitDot").classList.toggle("set", isSet);
    document.getElementById("kitStatus").textContent = isSet ? "API key saved" : "no API key saved yet";
  }

  function setTypeformStatus(isSet){
    document.getElementById("typeformDot").classList.toggle("set", isSet);
    document.getElementById("typeformStatus").textContent = isSet ? "webhook secret saved" : "no webhook secret saved yet";
  }

  async function save(){
    const btn = document.getElementById("saveBtn");
    btn.disabled = true;
    const payload = {
      client: document.getElementById("client").value || "frank",
      client_name: document.getElementById("client_name").value,
      wistia_media_id: document.getElementById("wistia_media_id").value,
      typeform_url: document.getElementById("typeform_url").value,
      typeform_webhook_secret: document.getElementById("typeform_webhook_secret").value,
      kit_tag_id: document.getElementById("kit_tag_id").value,
      kit_api_key: document.getElementById("kit_api_key").value,
      allowed_origin: document.getElementById("allowed_origin").value,
    };
    try {
      const r = await fetch("/api/settings", {
        method: "POST",
        headers: { "content-type": "application/json", "x-admin-key": ADMIN_KEY },
        body: JSON.stringify(payload),
      });
      const data = await r.json();
      const msg = document.getElementById("saveMsg");
      if (data.ok) {
        msg.textContent = `Saved. Typeform webhook: ${data.webhook_url}`;
        msg.className = "msg ok";
        document.getElementById("kit_api_key").value = "";
        document.getElementById("typeform_webhook_secret").value = "";
        await loadConfig();
      } else {
        msg.textContent = data.error || "Something went wrong.";
        msg.className = "msg err";
      }
    } catch (e) {
      const msg = document.getElementById("saveMsg");
      msg.textContent = "Network error.";
      msg.className = "msg err";
    }
    btn.disabled = false;
  }

  if (ADMIN_KEY) {
    loadConfig().then((ok) => {
      if (ok) {
        document.getElementById("gateCard").style.display = "none";
        document.getElementById("formCard").style.display = "block";
      }
    });
  }
</script>
</body>
</html>
