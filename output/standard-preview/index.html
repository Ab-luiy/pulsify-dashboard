<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulsify</title>
  <meta name="description" content="Your one stop for info, content creation, and building a 7-figure audience.">
  <meta name="theme-color" content="#100f0d">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/shared/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/site/site.css">
  <script src="/site/site.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Pulsify home">
      <img src="/assets/brand/variations/07-monogram.svg" alt="" width="28" height="28">
      <span>Pulsify</span>
    </a>
  </header>

  <main class="hero">
    <div class="hero-inner">
      <h1>Build the audience. Then the business.</h1>
      <p>Your one stop for info, content creation, and building a 7-figure audience.</p>
      <button class="button" type="button" data-open-chooser>Get started</button>
    </div>
  </main>

  <footer class="site-footer">
    <span>© Pulsify</span>
    <a href="/privacy">Privacy</a>
    <a href="/terms">Terms</a>
  </footer>

  <dialog class="chooser" aria-labelledby="chooser-title">
    <button class="close" type="button" data-close-chooser aria-label="Close">×</button>
    <h2 id="chooser-title">Sign in to Pulsify</h2>
    <p class="hint">Choose how you work with us.</p>
    <a class="choice" href="/login/client">
      <span><strong>Client</strong><small>Your workspace, content and growth</small></span>
      <span aria-hidden="true">→</span>
    </a>
    <a class="choice" href="/login/operator">
      <span><strong>Operator</strong><small>The Pulsify team</small></span>
      <span aria-hidden="true">→</span>
    </a>
  </dialog>
</body>
</html>
