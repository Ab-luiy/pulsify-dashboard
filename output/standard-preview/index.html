<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulsify</title>
  <meta name="description" content="Your one stop for building a seven-figure audience.">
  <meta name="theme-color" content="#08090b">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/shared/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/site/site.css">
  <script src="/site/site.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Pulsify home">
      <span class="brand-mark"><img src="/assets/brand/variations/07-monogram.svg" alt="" width="28" height="28"></span>
      <span class="brand-word">Pulsify</span>
    </a>
  </header>

  <main class="hero">
    <div class="hero-inner">
      <div class="hero-copy">
        <h1>Pulsify</h1>
        <p>Your one stop for building a seven-figure audience.</p>
        <button class="button hero-button" type="button" data-open-chooser>Get started</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <span>© Pulsify</span>
    <span class="footer-links"><a href="/privacy">Privacy</a><a href="/terms">Terms</a></span>
  </footer>

  <dialog class="chooser" aria-labelledby="chooser-title">
    <button class="close" type="button" data-close-chooser aria-label="Close">×</button>
    <p class="kicker">Choose a workspace</p>
    <h2 id="chooser-title">Sign in to Pulsify</h2>
    <p class="hint">Use the workspace built for you.</p>
    <a class="choice choice-primary" href="/login/client">
      <span><strong>Client</strong><small>Your workspace, content and growth</small></span>
      <span aria-hidden="true">↗</span>
    </a>
    <a class="choice" href="/login/operator">
      <span><strong>Operator</strong><small>The Pulsify team</small></span>
      <span aria-hidden="true">↗</span>
    </a>
  </dialog>
</body>
</html>
