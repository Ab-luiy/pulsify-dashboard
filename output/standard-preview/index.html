<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulsify · Build your 7-figure audience</title>
  <meta name="description" content="Build your 7-figure audience.">
  <meta name="theme-color" content="#08090b">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/shared/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/shared/fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/site/site.css">
  <script src="/site/site.js" defer></script>
</head>
<body class="public-home oversized-emblem">
  <div class="si-atmos" aria-hidden="true"><i></i></div>
  <header class="site-header">
    <a class="brand" href="/" aria-label="Pulsify home">
      <span class="brand-mark"><img src="/assets/brand/variations/07-monogram.svg" alt="" width="28" height="28"></span>
      <span class="brand-word">Pulsify</span>
    </a>
  </header>

  <main class="hero">
    <div class="hero-inner">
      <div class="hero-copy">
        <div class="brand-stage">
          <div class="hero-emblem" aria-hidden="true"><span class="emblem-art"></span></div>
        </div>
        <h1>Pulsify</h1>
        <p>Build Your 7-Figure Audience</p>
        <button class="button hero-button" type="button" data-open-chooser>Get started</button>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <span>© <span data-year>2026</span> Pulsify</span>
    <span class="footer-links"><a href="/privacy">Privacy</a><a href="/terms">Terms</a></span>
  </footer>

  <dialog class="chooser" aria-labelledby="chooser-title">
    <button class="close" type="button" data-close-chooser aria-label="Close">×</button>
    <div class="entry-emblem" aria-hidden="true"><span class="emblem-art"></span></div>
    <p class="kicker">Pulsify</p>
    <h2 id="chooser-title">Continue as</h2>
    <a class="choice choice-primary" href="/login/client">
      <span><strong>Client portal</strong><small>Review work and next steps</small></span>
      <span aria-hidden="true">↗</span>
    </a>
    <a class="choice" href="/login/operator">
      <span><strong>Team console</strong><small>Manage clients and delivery</small></span>
      <span aria-hidden="true">↗</span>
    </a>
  </dialog>
</body>
</html>
