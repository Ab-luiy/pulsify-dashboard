<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{META_DESCRIPTION}}">
  <title>{{PAGE_TITLE}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body
  data-client="{{CLIENT_SLUG}}"
  data-page-id="main"
  data-api-origin="https://pulsify-funnels.pages.dev">
  <main>
    <section class="hero" aria-labelledby="hero-title">
      <div class="shell hero-shell">
        <div class="brand-mark">{{BRAND_MARK}}</div>
        <div class="audience-pill">
          {{AUDIENCE_PILL}}
        </div>

        <h1 id="hero-title">
          {{HEADLINE_LINE_ONE}}
          <em>{{HEADLINE_EMPHASIS}}</em>
        </h1>

        <p class="hero-subhead">{{HERO_SUBHEAD}}</p>

        <div class="training-frame" id="training" data-video-block hidden>
          <div data-pulsify-wistia></div>
          <div class="training-note">
            <span>{{VIDEO_NOTE_PRIMARY}}</span>
            <span>{{VIDEO_NOTE_SECONDARY}}</span>
          </div>
        </div>
        <a class="primary-cta" href="#apply" data-application-cta hidden>{{HERO_CTA}}</a>
      </div>
    </section>

    <section class="application-section" id="apply" data-application-section aria-labelledby="apply-title" hidden>
      <div class="shell">
        <div class="section-pill">
          {{APPLY_STEP_LABEL}}
        </div>
        <h2 id="apply-title">{{APPLY_HEADING}}</h2>
        <p class="section-intro">{{APPLY_INTRO}}</p>

        <div class="application-embed">
          <div data-pulsify-typeform class="typeform-live"></div>
        </div>
      </div>
    </section>

    <section class="proof-section" data-proof-section aria-labelledby="proof-title" hidden>
      <div class="shell proof-shell">
        <h2 id="proof-title">People we've helped</h2>
        <div class="proof-feed" data-proof-feed></div>
      </div>
    </section>

    <section class="closing-section" data-application-cta aria-label="Apply now" hidden>
      <div class="shell closing-shell">
        <a class="primary-cta" href="#apply">{{CLOSING_CTA}}</a>
      </div>
    </section>
  </main>

  <footer>
    <div class="shell footer-inner">
      <span>{{FOOTER_LABEL}}</span>
      <p>{{FOOTER_DISCLAIMER}}</p>
    </div>
  </footer>

  <script src="https://pulsify-funnels.pages.dev/js/funnel-integrations.js"></script>
</body>
</html>
