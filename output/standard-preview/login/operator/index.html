<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operator sign in · Pulsify</title>
  <meta name="description" content="Sign in to the Pulsify team console.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0c0d">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preload" href="/shared/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/site/signin.css">
  <script src="/site/site.js" defer></script>
</head>
<body class="signin" data-audience="operator">
  <div class="si-atmos" aria-hidden="true"><i></i></div>
  <header class="si-header">
    <a class="si-brand" href="/" aria-label="Pulsify home"><img src="/assets/brand/variations/05-lockup-white.svg" alt="Pulsify" width="100" height="28"></a>
  </header>

  <main class="si-main">
    <section class="si-card" aria-labelledby="title">
      <nav class="si-switch" aria-label="Sign in as">
        <a href="/login/client">Client</a>
        <a href="/login/operator" aria-current="page">Team</a>
      </nav>
      <h1 id="title">Team console</h1>
      <p class="lead">Sign in with your team account.</p>
      <p class="notice" data-notice role="status" hidden></p>
      <a class="button full" data-continue href="/api/propelauth/start?as=operator">Continue</a>
    </section>
  </main>

  <footer class="si-footer">
    <span>© <span data-year>2026</span> Pulsify</span>
    <span><a href="/privacy">Privacy</a><a href="/terms">Terms</a></span>
  </footer>
</body>
</html>
