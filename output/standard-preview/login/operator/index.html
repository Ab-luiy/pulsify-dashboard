<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operator sign in · Pulsify</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#08090b">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preload" href="/shared/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/site/site.css">
  <script src="/site/site.js" defer></script>
</head>
<body data-audience="operator">
  <header class="site-header">
    <a class="brand" href="/" aria-label="Pulsify home">
      <span class="brand-mark"><img src="/assets/brand/variations/07-monogram.svg" alt="" width="28" height="28"></span>
      <span class="brand-word">Pulsify</span>
    </a>
  </header>

  <main class="auth">
    <section class="auth-card" aria-labelledby="title">
      <div class="entry-emblem" aria-hidden="true"><span class="emblem-art"></span></div>
      <p class="kicker">Pulsify team</p>
      <h1 id="title">Team console</h1>
      <p class="lead">Sign in with your team account.</p>
      <p class="notice" data-notice role="status" hidden></p>
      <a class="button full" data-continue href="/api/propelauth/start?as=operator">Continue to sign in</a>
      <p class="switch">Pulsify client? <a href="/login/client">Client sign in</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <span>© Pulsify</span>
    <span class="footer-links"><a href="/privacy">Privacy</a><a href="/terms">Terms</a></span>
  </footer>
</body>
</html>
