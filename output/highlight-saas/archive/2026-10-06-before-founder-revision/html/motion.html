.bridge{left:0;top:0;width:1080px;height:1920px}.wordmark{filter:invert(1)}.subtitles b{color:#6871f4;font-weight:700}</style></head><body><main class="slide"><div class="bg"><img class="photo" src="assets/photo-09.jpg"><div class="wash"></div><div class="ribbon"></div></div><div class="title"></div><img class="hero-coin" src="assets/coin-master-3d.png"><div class="chain-stage"><svg class="bridge" viewBox="0 0 1080 1920"><path d="M490 659H590 M780 718V760H300V805 M490 864H590 M780 923V965H300V1010 M490 1069H590"/></svg></div><div class="motion-card"><img src="assets/demo-screen.png"></div><span class="demo">Example workspace</span><div class="hint"></div><img class="detail" src="assets/demo-detail.png"><img class="wordmark" src="assets/lockup.svg"><div class="subtitles"><span></span></div></main><script>
let timeline,labels;const $=s=>document.querySelector(s);const clamp=x=>Math.max(0,Math.min(1,x));const ease=x=>1-Math.pow(1-clamp(x),3);const windowAlpha=(t,a,b)=>Math.min(ease((t-a)/.65),ease((b-t)/.65));
async function setup(){const c=await(await fetch('assets/copy.json')).json();timeline=await(await fetch('assets/motion-timeline.json')).json();labels=c[3].lines[0].split('. ').map(s=>s.replace(/\.$/,''));$('.title').textContent=c[9].lines[0].replace('On screen: ','');labels.forEach((text,i)=>{const el=document.createElement('div');el.className='node';el.textContent=text;el.style.left=(i%2?590:110)+'px';el.style.top=(600+Math.floor(i/2)*205)+'px';$('.chain-stage').append(el)});await document.fonts.ready;await Promise.all(Array.from(document.images).map(im=>im.decode()));window.motionReady=true;setTime(0)}
function setTime(t){
 $('.photo').style.transform=`scale(${1+.015*t/27})`;$('.ribbon').style.transform=`translate(${Math.sin(t*.25)*100}px,${Math.cos(t*.3)*60}px) rotate(${-30+t*.7}deg)`;
 $('.title').style.opacity=windowAlpha(t,-1,5.8);$('.title').style.transform=`translateY(${(1-ease(t/1.2))*30}px)`;
 const a=Math.max(windowAlpha(t,-1,3.8),windowAlpha(t,23.8,29));$('.hero-coin').style.opacity=a;$('.hero-coin').style.transform=`translateY(${t>23?0:20*(1-ease(t))}px) scale(${t>23?.88+.12*ease((t-23.8)/2):.9+.1*ease(t/2)})`;
 $('.chain-stage').style.opacity=windowAlpha(t,5.1,11.2);Array.from(document.querySelectorAll('.node')).forEach((n,i)=>{n.style.opacity=ease((t-5.2-i*.45)/.45);n.style.transform=`translateY(${(1-ease((t-5.2-i*.45)/.45))*30}px)`;n.classList.toggle('lit',i===Math.min(5,Math.floor((t-5.2)/.8)))});
 const cardAlpha=Math.max(windowAlpha(t,10.4,17.6),windowAlpha(t,20.2,24.6));$('.motion-card').style.opacity=cardAlpha;$('.motion-card').style.transform=`translateY(${(1-cardAlpha)*45}px) scale(${.96+.04*cardAlpha})`;$('.demo').style.opacity=Math.max(cardAlpha,windowAlpha(t,17.2,20.8));
 $('.detail').style.opacity=windowAlpha(t,17.2,20.8);$('.detail').style.transform=`scale(${.95+.05*ease((t-17.2)/.7)})`;
 const hints=[{a:10.4,b:13.9,text:labels[0]+'. '+labels[1]+'.'},{a:13.9,b:17.5,text:labels[2]+'.'},{a:17.2,b:20.8,text:labels[3]+'. '+labels[4]+'.'},{a:20.2,b:24.6,text:labels[5]+'.'}];const h=hints.find(h=>t>=h.a&&t<h.b);$('.hint').textContent=h?h.text:'';$('.hint').style.opacity=h?windowAlpha(t,h.a,h.b):0;
 $('.wordmark').style.opacity=windowAlpha(t,24.3,29);const cue=timeline.cues.find(c=>t>=c.start&&t<c.end);const safe=cue?cue.text.replaceAll('&','&amp;').replaceAll('<','&lt;'):'';const key=["what you're good at",'one place','first view','what to post',"who's closing",'pulsify'].find(k=>safe.includes(k));$('.subtitles span').innerHTML=key?safe.replace(key,'<b>'+key+'</b>'):safe;$('.subtitles').style.opacity=cue?1:0;window.currentMotionTime=t;
}
setup();
